syntax = "proto3";

package muxcore.notification.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/Muxcore-Media/contracts-notification/muxcore/notification/v1;notificationv1";

// NotificationService is the gRPC surface for NotificationProvider implementers
// (notification-default, notification-apprise) and the name reconciled by contracts-reconciler.
service NotificationService {
  rpc Notify(NotifyRequest) returns (NotifyResponse);
  rpc Configure(ConfigureRequest) returns (ConfigureResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
  // Test sends a fixture ping to one channel (admin-ui / muxcorectl smoke; no real media event).
  rpc Test(TestRequest) returns (TestResponse);
}

enum Channel {
  CHANNEL_UNSPECIFIED = 0;
  CHANNEL_DISCORD = 1;
  CHANNEL_SLACK = 2;
  CHANNEL_WEBHOOK = 3;
  CHANNEL_EMAIL = 4;
  CHANNEL_APPRISE = 5;
}

// Severity drives portable Discord/Slack color mapping across implementers.
enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_INFO = 1;
  SEVERITY_SUCCESS = 2;
  SEVERITY_WARNING = 3;
  SEVERITY_ERROR = 4;
}

message NotifyRequest {
  string title = 1;
  string message = 2;
  Severity severity = 3;
  string source_module = 4;  // module that triggered the notification
  repeated Channel channels = 5;  // empty = all configured channels
  map<string, string> fields = 6; // additional structured fields
}

message NotifyResponse {
  repeated ChannelResult results = 1;
}

message ChannelResult {
  Channel channel = 1;
  bool success = 2;
  string error = 3;
}

message ConfigureRequest {
  Channel channel = 1;
  // Per-channel settings. Canonical keys (implementers MUST accept these names):
  //
  // Discord, Slack, Webhook:
  //   webhook_url — HTTPS webhook endpoint
  //
  // Email:
  //   smtp_host, smtp_port, smtp_user, smtp_pass, smtp_from, to
  //
  // Apprise:
  //   urls — comma-separated Apprise URLs
  //   token — optional Apprise API token
  //
  // Aliases such as "host", "from", or "pass" are non-portable; callers should use the keys above.
  map<string, string> settings = 2;
  // When false, disable the channel (clear active configuration). When true or unset, upsert settings.
  bool enabled = 3;
}

message ConfigureResponse {
  bool configured = 1;
}

message StatusRequest {}

message StatusResponse {
  repeated ChannelStatus channels = 1;
}

message ChannelStatus {
  Channel channel = 1;
  bool enabled = 2;
  // Human-readable label (channel type, recipient hint). Must NOT include webhook URLs,
  // SMTP credentials, Apprise tokens, or other secrets.
  string description = 3;
  string last_error = 4;
  google.protobuf.Timestamp last_success_at = 5;
}

message TestRequest {
  Channel channel = 1;
}

message TestResponse {
  ChannelResult result = 1;
}
